# Example popup rules — format defined in docs/SPEC.md §9.2.
# In a project repo this file sits at popups.yaml. Used by popup guard layer 2 (agent, no AI).
schema: coral/popups@1

rules:
  # All keys inside `match` must hold. Text matching is case-insensitive and whitespace-normalised.
  - name: android_permission
    match: { package: 'com.android.permissioncontroller' }
    tap_any: ['Khi dùng ứng dụng', 'Cho phép', 'While using the app', 'Allow']

  - name: ios_notification
    match: { alert_contains: 'Notifications' }
    tap_any: ['Allow', 'Cho phép']

  - name: ios_location
    match: { alert_contains: 'location' }
    tap_any: ['Allow While Using App', 'Cho phép khi dùng ứng dụng']

  - name: rate_app
    match: { text_contains: 'Đánh giá' }
    tap_any: ['Để sau', 'Không, cảm ơn', 'Not now']

# Buttons nobody but a human-written step may tap (SPEC P6, §9.4):
# enforced for the popup guard, the popup resolver, the Explorer and heal patches.
never_tap: ['Mua', 'Thanh toán', 'Xóa', 'Đăng xuất', 'Buy', 'Pay', 'Delete', 'Log out']
