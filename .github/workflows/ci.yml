name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      # Device tests (*.device.test.ts) are excluded unless CORAL_DEVICE_TESTS=1 (SPEC D21).
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: docker compose up -d --wait --wait-timeout 180
      - run: pnpm install --frozen-lockfile
      # *.int.test.ts only (SPEC D34); migrations run in the Vitest global setup.
      - run: pnpm test:int
      - if: always()
        run: docker compose down -v

  infra:
    name: Docker Compose services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 180
      - run: docker compose ps
      - if: always()
        run: docker compose down -v
