name: Device

# 🔌 Checks on a real Android 14 emulator — Phase 1 (T039, T041, T056, T060, T063), the Phase 2
# Recorder (T046) and the Phase 3 Explorer (T036): GitHub-hosted Linux runners have KVM. Runs on demand, and on pushes that touch
# the device path.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/device.yml
      - scripts/ci-device.sh
      - scripts/ci-contact-sheet.py
      - scripts/phase1-e2e.mjs
      - packages/runner/**
      - apps/agent/**
      - packages/cli/**
      - fixtures/testcases/mydemo-*.yaml
      - packages/shared/src/popups/**
      # Phase 2: the Recorder end to end (T046).
      - e2e/us4-recorder.e2e.ts
      - e2e/fixtures.ts
      - e2e/seed.ts
      - e2e/live.ts
      - playwright.config.ts
      - apps/server/src/recordings/**
      - apps/web/src/features/recorder/**
      # Phase 3: the Explorer on My Demo App (T036).
      - scripts/phase3-explore.mjs
      - apps/server/src/explorer/**
      - apps/server/src/ai/**
      - packages/brain/src/adapters/fake.ts
      - examples/brains.fake.yaml

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sauce Labs My Demo App (research R15); release 2.3.0 = commit 3e51416.
  MYDEMO_RELEASE: '2.3.0'

jobs:
  emulator:
    name: Android 14 emulator (My Demo App)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Only to store the screenshot sheets as git blobs (see "Screenshot sheets").
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download My Demo App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$MYDEMO_RELEASE" --repo saucelabs/my-demo-app-android --json assets -q '.assets[].name'
          gh release download "$MYDEMO_RELEASE" --repo saucelabs/my-demo-app-android --pattern '*.apk' --dir apk
          apk=$(ls apk/*.apk | grep -vi debug | head -1)
          echo "CORAL_TEST_APK=$PWD/$apk" >> "$GITHUB_ENV"
          sha256sum apk/*.apk
      - run: docker compose up -d --wait --wait-timeout 180
      - run: pnpm --filter @coral/server db:migrate
      - name: Device checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The sample app's public demo account, printed on its login screen (research R15).
          # Repository secrets of the same name take precedence.
          CORAL_SECRET_TEST_USER: ${{ secrets.CORAL_SECRET_TEST_USER || 'bod@example.com' }}
          CORAL_SECRET_TEST_PASSWORD: ${{ secrets.CORAL_SECRET_TEST_PASSWORD || '10203040' }}
          CORAL_DEVICE_OUT: ${{ github.workspace }}/device-results
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # More memory and cores: with the defaults the launcher kept going "not responding".
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # The runner action executes each script line separately: keep it to one line.
          script: bash scripts/ci-device.sh
      # Contact sheets of the step screenshots. Each is also stored as a git blob (no ref, no
      # commit) and its sha logged ("CORAL-SHEET <file> <sha>"): reports fetch it from
      # GET /repos/{repo}/git/blobs/{sha} when the artifact storage is out of reach.
      - name: Screenshot sheets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/sheets-venv
          /tmp/sheets-venv/bin/pip install --quiet pillow
          /tmp/sheets-venv/bin/python scripts/ci-contact-sheet.py device-results device-results/sheets
          for f in device-results/sheets/*.jpg device-results/e2e/*.png; do
            [ -e "$f" ] || continue
            jq -n --rawfile c <(base64 -w0 "$f") '{content: $c, encoding: "base64"}' >/tmp/blob.json
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)
            echo "CORAL-SHEET $(basename "$f") $sha"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-results
          path: device-results
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
